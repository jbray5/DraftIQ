<!doctype html>
<html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>SeasonIQ · Results</title><link rel="stylesheet" href="season.css"/></head>
<body>
<div class="grid">
  <div class="panel"><h2>MY WEEKS <span class="r">actual vs projected · hindsight bench leak</span></h2><div id="weeks"><div class="skel" style="height:120px"></div></div></div>
  <div class="panel"><h2>LEAGUE TABLE <span class="r">sorted by record · bars = points for</span></h2><div id="lg"><div class="skel" style="height:220px"></div></div></div>
</div>
<script src="season.js"></script>
<script>
seasonNav('performance');
(async()=>{
  try{
    const d=await j('/api/performance');
    if(!d.weeks.length){
      $('weeks').innerHTML=`<div class="allclear" style="border-color:var(--line);color:var(--ink2)">
        Awaiting week 1 — this page fills itself in after each week completes:<br><br>
        · W/L and score vs your opponent<br>
        · actual vs what the projections promised<br>
        · <b>bench leak</b> — points a perfect-hindsight (and legal) lineup would have added</div>`;
    }else{
      let w=0,l=0,leak=0;
      $('weeks').innerHTML=d.weeks.map(x=>{
        w+=x.result==='W';l+=x.result==='L';leak+=x.benchLeak;
        const margin=(x.actual-x.oppScore).toFixed(1);
        return `<div class="action" style="border-color:${x.result==='W'?'rgba(20,168,105,.4)':'rgba(239,76,100,.4)'};border-left-color:${x.result==='W'?'var(--good)':'var(--bad)'};background:linear-gradient(90deg,${x.result==='W'?'rgba(20,168,105,.08)':'rgba(239,76,100,.07)'},transparent 60%)">
          <div style="display:flex;align-items:center;gap:14px">
            <div style="font:700 26px var(--disp);color:${x.result==='W'?'var(--good-soft)':'var(--bad-soft)'}">${x.result}</div>
            <div style="flex:1">
              <div><b>week ${x.week}</b> <span class="dim">vs ${esc(x.opponent)}</span></div>
              <div class="dim">${x.actual} – ${x.oppScore} (${margin>0?'+':''}${margin}) · projected ${x.projected}</div>
            </div>
            <div style="text-align:right"><div class="${x.benchLeak>5?'bad':'dim'}" style="font:600 15px var(--disp)">${x.benchLeak}</div><div class="dim" style="font-size:9px;letter-spacing:.15em">LEAK</div></div>
          </div></div>`;
      }).join('')
      +`<div class="rowline dim">record <b class="muted">${w}–${l}</b> · total hindsight leak ${leak.toFixed(1)} pts <span class="dim">(luck-inclusive — the honest scorecard is vs the projection-optimal lineup)</span></div>`;
    }
    const maxPf=Math.max(...d.standings.map(t=>t.pf))||1;
    $('lg').innerHTML='<table><tr><th>#</th><th>team</th><th class="num">W–L</th><th class="num">PF</th><th style="width:24%"></th><th class="num">PF rk</th></tr>'
      +d.standings.map((t,i)=>`<tr class="${/SCLSU/i.test(t.team)?'me':''}"><td class="dim">${String(i+1).padStart(2,'0')}</td>
        <td>${esc(t.team)}</td><td class="num">${t.wins}–${t.losses}</td><td class="num">${t.pf}</td>
        <td><span class="cellbar" style="height:12px;display:block;position:relative"><i style="width:${(t.pf/maxPf*100).toFixed(0)}%"></i></span></td>
        <td class="num dim">${t.pfRank||''}</td></tr>`).join('')
      +'</table><div class="dim" style="margin-top:6px">sorted by record · PF rk = points-for rank · as of '+esc(d.fetchedAt||'')+'</div>';
  }catch(e){$('weeks').innerHTML='<div class="err">'+esc(e.message)+'</div>';}
})();
</script>
</body></html>
