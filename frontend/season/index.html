<!doctype html>
<html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>SeasonIQ · Dashboard</title><link rel="stylesheet" href="season.css"/></head>
<body>
<div class="grid3" id="cards">
  <div class="card" id="cdMatch"><div class="k">this week</div>
    <div style="display:flex;align-items:center;gap:18px">
      <div class="donut" id="wpDonut" style="--p:0"><b id="cMatch">…</b><span>WIN</span></div>
      <div style="flex:1"><div class="v" style="font-size:20px" id="cMatchScore"></div>
        <div class="sub" id="cMatchSub">loading…</div></div>
    </div></div>
  <div class="card" id="cdWire"><div class="k">waiver wire</div>
    <div class="v dim" id="cWire">…</div><div class="sub" id="cWireSub">loading…</div></div>
  <div class="card" id="cdOdds"><div class="k">title odds · ESPN / ours</div>
    <div class="v dim" id="cOdds">…</div>
    <canvas id="cSpark" style="height:34px;margin-top:8px"></canvas>
    <div class="sub" id="cOddsSub">loading…</div></div>
</div>
<div class="panel" style="margin-top:18px"><h2>TODAY'S VERDICTS <span class="r">one glance, then go live your life</span></h2><div id="verdicts"><div class="skel" id="vSkel" style="height:44px"></div></div></div>
<script src="season.js"></script>
<script>
seasonNav('index');
/* Each tile paints the moment ITS data lands — never gated on the slowest
   endpoint (the wire's cold load can take a minute+; the old all-at-once
   version left the whole page spinning that long). */
const SLOTS={match:'',wire:'',ledger:''};
function paint(){
  const parts=[SLOTS.match,SLOTS.wire,SLOTS.ledger].filter(Boolean);
  $('verdicts').innerHTML=parts.join('')||'<div class="skel" style="height:44px"></div>';
}
j('/api/startsit').then(m=>{
  setHdr(m.me.team,m.week,m.fetchedAt);
  const w=Math.round(m.winProb*100);
  $('wpDonut').style.setProperty('--p',w);
  countUp($('cMatch'),w,{suffix:'%'});
  const live=(m.me.playedStarters||0)+(m.opponent.playedStarters||0)>0;
  $('cMatchScore').innerHTML=`${live?m.me.liveExp:m.me.currentTotal} <span class="dim" style="font-size:13px">vs ${live?m.opponent.liveExp:m.opponent.projTotal}</span>`;
  $('cMatchSub').textContent=`${live?'LIVE · ':''}${m.opponent.team}`;
  $('cdMatch').className='card '+(m.winProb>=0.5?'ok':'no');
  SLOTS.match=m.swaps&&m.swaps.length
    ?`<div class="action"><b class="hd">▶ START/SIT:</b> ${m.swaps.map(s=>`${s.slot?'['+esc(s.slot)+'] ':''}start ${esc(s.start)}${s.sit?' / sit '+esc(s.sit):''}`).join(' · ')} (+${m.benchLeak} pts) — <a href="matchup.html" style="color:var(--amber)">matchup →</a></div>`
    :`<div class="rowline good">✓ lineup optimal (bench leak ${m.benchLeak})</div>`;
  paint();
}).catch(e=>{$('cMatchSub').textContent='error: '+String(e.message||e).slice(0,50);
  SLOTS.match='<div class="err">matchup: '+esc(e.message||e)+'</div>';paint();});
j('/api/waivers').then(w=>{
  $('cWire').textContent=w.allClear?'ALL CLEAR':(w.actions.length+' ACTION'+(w.actions.length>1?'S':''));
  $('cWire').className='v '+(w.allClear?'good':'bad');
  $('cWireSub').textContent=((w.stream||{}).line||'')+(w.waiverPriority?` · priority ${w.waiverPriority}`:'');
  $('cdWire').className='card '+(w.allClear?'ok':'mid');
  let s='';
  if(w.allClear)s='<div class="rowline good">✓ wire: no moves needed</div>';
  else w.actions.forEach(a=>{s+=`<div class="action"><b class="hd">▶ ${a.type}:</b> ${esc(a.add.name)}${a.drop?(' for '+esc(a.drop.name)):''} (${a.netVorpWk!=null?(a.netVorpWk>=0?'+':'')+a.netVorpWk+'/wk':'NET '+a.netVorp}) — <a href="wire.html" style="color:var(--amber)">wire →</a></div>`;});
  (w.injuryFlags||[]).forEach(f=>{s+=`<div class="rowline">⚕ <span class="bad">${esc(f.name)} ${f.injury}</span> <span class="dim">${esc((f.news||'').slice(0,110))}</span></div>`;});
  SLOTS.wire=s;paint();
}).catch(e=>{$('cWireSub').textContent='error: '+String(e.message||e).slice(0,50);
  SLOTS.wire='<div class="err">wire: '+esc(e.message||e)+'</div>';paint();});
j('/api/season-odds').then(async o=>{
  const me=o.myTeam, e=(o.odds[me]||{}).title||0, u=(o.oddsOurs[me]||{}).title||0;
  $('cOdds').innerHTML=`<span class="cy">${(e*100).toFixed(1)}%</span> <span class="dim">/</span> ${(u*100).toFixed(1)}%`;
  $('cOdds').className='v';
  $('cOddsSub').textContent=(o.seasonAware?'record-aware · ':'')+'field = 10% · two judges';
  $('cdOdds').className='card '+((e+u)/2>=0.1?'ok':'mid');
  try{
    const h=(await j('/api/season-history')).history||[];
    const mine=h.map(x=>((x.ours||{})[me]||{}).title).filter(v=>v!=null);
    if(mine.length>1)spark($('cSpark'),mine,'#D08004');
  }catch(_){}
}).catch(e=>{$('cOdds').textContent='—';$('cOddsSub').textContent='odds error: '+esc(String(e.message||e).slice(0,60));});
j('/api/performance').then(p=>{
  const me=(p.standings||[]).find(t=>/SCLSU/i.test(t.team));
  if(me){SLOTS.ledger=`<div class="rowline dim">ledger: <b class="muted">${me.wins}–${me.losses}</b> · PF ${me.pf} (rank ${me.pfRank}) · ${(p.weeks||[]).length} week${(p.weeks||[]).length===1?'':'s'} banked</div>`;paint();}
}).catch(()=>{});
</script>
</body></html>
