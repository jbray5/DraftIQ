<!doctype html>
<html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>SeasonIQ · Standings</title><link rel="stylesheet" href="season.css"/></head>
<body>
<div class="grid">
  <div>
    <div class="panel"><h2>PROJECTED STANDINGS <span class="r">1,000-season Monte Carlo · record-aware · two judges</span></h2><div id="tbl"><div class="skel" style="height:220px"></div></div></div>
    <div class="panel"><h2>TITLE% TRAJECTORY <span class="r">daily snapshots · hover for detail</span></h2>
      <div style="position:relative"><canvas id="traj" style="height:210px"></canvas>
        <div id="tip" style="position:absolute;display:none;pointer-events:none;background:var(--panel2);border:1px solid var(--line2);border-radius:8px;padding:6px 10px;font-size:11px;box-shadow:var(--shadow);z-index:5"></div></div>
      <div class="legend"><span><i style="background:#D08004"></i>OUR JUDGE (me)</span><span><i style="background:#1F93BD"></i>ESPN JUDGE (me)</span><span><i style="background:#2E3D55"></i>the field (ours)</span></div>
      <div class="dim" id="trajNote"></div></div>
  </div>
  <div>
    <div class="panel"><h2>TRADE MAP <span class="r">where the judges disagree, value moves</span></h2><div id="map"><div class="skel" style="height:80px"></div></div></div>
    <div class="panel"><h2>PLANNER <span class="r">bye crunch ahead · playoff-week opponents (wks 15–17)</span></h2><div id="plan"><div class="skel" style="height:120px"></div></div></div>
  </div>
</div>
<script src="season.js"></script>
<script>
seasonNav('standings');
(async()=>{
  try{
    const d=await j('/api/season-odds');
    setHdr(d.myTeam,d.week,d.fetchedAt);
    const avg=nm=>(((d.odds[nm]||{}).title||0)+((d.oddsOurs[nm]||{}).title||0))/2;
    const rows=Object.keys(d.odds).sort((a,b)=>avg(b)-avg(a));
    const maxT=Math.max(...rows.map(nm=>Math.max((d.odds[nm]||{}).title||0,(d.oddsOurs[nm]||{}).title||0)))||1;
    $('tbl').innerHTML='<table><tr><th>team</th><th class="num">ESPN</th><th class="num">OURS</th><th style="width:26%"></th><th class="num">po%</th><th class="num">xW</th></tr>'
      +rows.map(nm=>{const me=nm===d.myTeam,e=d.odds[nm]||{},o=d.oddsOurs[nm]||{};
        return `<tr class="${me?'me':''}"><td>${esc(nm)}${me?' ◄':''}</td>
          <td class="num cy">${pct(e.title||0)}</td>
          <td class="num ${Math.abs((e.title||0)-(o.title||0))>=0.03?'warn':''}">${pct(o.title||0)}</td>
          <td><span class="cellbar" style="height:14px;display:block;position:relative">
            <i style="top:3px;height:3px;width:${((e.title||0)/maxT*100).toFixed(0)}%;background:rgba(31,147,189,.55)"></i>
            <i style="top:9px;height:3px;width:${((o.title||0)/maxT*100).toFixed(0)}%;background:rgba(208,128,4,.7)"></i></span></td>
          <td class="num dim">${Math.round(((e.playoff||0)+(o.playoff||0))/2*100)}%</td>
          <td class="num dim">${(((e.expWins||0)+(o.expWins||0))/2).toFixed(1)}</td></tr>`;}).join('')
      +'</table><div class="dim" style="margin-top:8px">'+esc(d.noiseNote||'')+'</div>';
    $('map').innerHTML=((d.tradeMap||[]).map(t=>`<div class="rowline">
      <b class="${t.delta>0?'good':'bad'}">${t.delta>0?'BUY':'SELL'}</b> ${esc(t.name)}
      <span class="dim">(${t.pos}${t.mine?' · YOURS':' · '+esc(t.owner)}) · ESPN ${t.pos}${t.espnRank} vs ours ${t.pos}${t.ourRank}</span>
      <div class="dim">${esc(t.read)}</div></div>`).join('')
      ||(d.tradeMapNote?'':'<div class="dim">judges agree on everyone (rare)</div>'))
      +(d.tradeMapNote?'<div class="dim">'+esc(d.tradeMapNote)+'</div>':'')
      +(d.oursJudgeNote?'<div class="dim" style="margin-top:4px">'+esc(d.oursJudgeNote)+'</div>':'');
  }catch(e){$('tbl').innerHTML='<div class="err">'+esc(e.message)+'</div>';}
  try{
    const pl=await j('/api/planner');
    let h='';
    (pl.crunch||[]).forEach(c=>{
      if(!c.byes.length)return;
      h+=`<div class="rowline${c.alert?' bad':''}">wk ${c.week}: ${c.byes.map(b=>`${esc(b.name)}${b.starter?' <b>(starter)</b>':''}`).join(', ')}${c.alert?' — <b class="bad">CRUNCH: plan a pickup the Tuesday before</b>':''}</div>`;
    });
    h=h||'<div class="rowline good">✓ no byes hit your roster in the next 4 weeks</div>';
    h+='<div class="dim" style="margin:10px 0 4px;letter-spacing:.15em;font-size:10px">PLAYOFF WEEKS (15–17)</div><table><tr><th>player</th><th>15</th><th>16</th><th>17</th></tr>'
      +(pl.playoff||[]).slice(0,12).map(p=>`<tr><td>${esc(p.name)} <span class="pos">${p.pos}</span></td><td class="${p.wk15==='BYE'?'bad':'dim'}">${p.wk15}</td><td class="${p.wk16==='BYE'?'bad':'dim'}">${p.wk16}</td><td class="${p.wk17==='BYE'?'bad':'dim'}">${p.wk17}</td></tr>`).join('')+'</table>'
      +`<div class="dim" style="margin-top:6px">${esc(pl.note||'')}</div>`;
    $('plan').innerHTML=h;
  }catch(e){$('plan').innerHTML='<div class="err">'+esc(e.message)+'</div>';}
  /* ---------- trajectory: my two judges bright, the field muted ---------- */
  try{
    const H=(await j('/api/season-history')).history||[];
    const c=$('traj');
    if(H.length<2){$('trajNote').textContent='trajectory chart unlocks after a few daily snapshots ('+H.length+' so far)';return;}
    const meName=(Object.keys(H.at(-1).ours||{})).find(t=>/SCLSU/i.test(t))||null;
    const teams=Object.keys(H.at(-1).ours||{});
    const series={ mine_o:H.map(x=>(((x.ours||{})[meName]||{}).title||0)*100),
                   mine_e:H.map(x=>(((x.espn||{})[meName]||{}).title||0)*100) };
    const field=teams.filter(t=>t!==meName).map(t=>H.map(x=>(((x.ours||{})[t]||{}).title||0)*100));
    const dpr=devicePixelRatio||1,r=c.getBoundingClientRect(),W=r.width,Hh=210;
    c.width=W*dpr;c.height=Hh*dpr;const x=c.getContext('2d');x.scale(dpr,dpr);
    const all=[...field.flat(),...series.mine_o,...series.mine_e];
    const hi=Math.max(20,Math.ceil(Math.max(...all)/5)*5), lo=0;
    const PX=56,PT=10,PB=22,PR=8;
    const X=i=>PX+i*(W-PX-PR)/(H.length-1), Y=v=>PT+(Hh-PT-PB)*(1-(v-lo)/(hi-lo));
    x.font='10px IBM Plex Mono';x.textBaseline='middle';
    for(let g=0;g<=4;g++){const v=lo+(hi-lo)*g/4;
      x.strokeStyle='rgba(28,41,64,.8)';x.beginPath();x.moveTo(PX,Y(v));x.lineTo(W-PR,Y(v));x.stroke();
      x.fillStyle='#5A6B85';x.textAlign='right';x.fillText(v.toFixed(0)+'%',PX-8,Y(v));}
    x.textAlign='center';x.fillStyle='#5A6B85';
    H.forEach((s,i)=>{if(i%Math.ceil(H.length/6)===0||i===H.length-1)x.fillText((s.date||'').slice(5),X(i),Hh-8);});
    const line=(vals,col,wd)=>{x.beginPath();vals.forEach((v,i)=>i?x.lineTo(X(i),Y(v)):x.moveTo(X(i),Y(v)));
      x.strokeStyle=col;x.lineWidth=wd;x.lineJoin='round';x.stroke();};
    field.forEach(vals=>line(vals,'#2E3D55',1));
    x.save();x.shadowColor='rgba(208,128,4,.6)';x.shadowBlur=8;line(series.mine_o,'#D08004',2.5);x.restore();
    line(series.mine_e,'#1F93BD',2);
    [['mine_o','#D08004'],['mine_e','#1F93BD']].forEach(([k,col])=>{const v=series[k].at(-1);
      x.beginPath();x.arc(X(H.length-1),Y(v),3.5,0,7);x.fillStyle=col;x.fill();
      x.strokeStyle='#101624';x.lineWidth=2;x.stroke();});
    x.textAlign='left';x.fillStyle='#E6EDF7';
    x.fillText('SCLSU '+series.mine_o.at(-1).toFixed(1)+'%',Math.min(X(H.length-1)+8,W-70),Y(series.mine_o.at(-1)));
    $('trajNote').textContent=H.length+' daily snapshots · faint lines = the other nine (our judge)';
    /* crosshair + tooltip */
    const tip=$('tip');
    c.onmousemove=ev=>{
      const b=c.getBoundingClientRect(),mx=ev.clientX-b.left;
      let i=Math.round((mx-PX)/((W-PX-PR)/(H.length-1)));
      i=Math.max(0,Math.min(H.length-1,i));
      tip.style.display='block';
      tip.style.left=Math.min(X(i)+12,W-150)+'px';tip.style.top='8px';
      tip.innerHTML=`<b>${esc((H[i].date||''))}</b> · wk ${H[i].week||'?'}<br>
        <span style="color:#D08004">ours ${series.mine_o[i].toFixed(1)}%</span> ·
        <span style="color:#57B9DC">ESPN ${series.mine_e[i].toFixed(1)}%</span>`;
    };
    c.onmouseleave=()=>tip.style.display='none';
  }catch(e){$('trajNote').textContent='trajectory: '+e.message;}
})();
</script>
</body></html>
