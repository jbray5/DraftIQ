<!doctype html>
<html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>SeasonIQ · Standings</title><link rel="stylesheet" href="season.css"/></head>
<body>
<div class="grid">
  <div>
    <div class="panel"><h2>PROJECTED STANDINGS <span class="r">1,000-season Monte Carlo · two judges</span></h2><div id="tbl" class="dim">loading…</div></div>
    <div class="panel"><h2>TITLE% TRAJECTORY <span class="r">daily snapshots · solid = our model, faint = ESPN</span></h2>
      <canvas id="traj" style="height:190px"></canvas><div class="dim" id="trajNote"></div></div>
  </div>
  <div>
    <div class="panel"><h2>TRADE MAP <span class="r">where the judges disagree, value moves</span></h2><div id="map" class="dim">loading…</div></div>
    <div class="panel"><h2>PLANNER <span class="r">bye crunch ahead · playoff-week opponents (wks 15–17)</span></h2><div id="plan" class="dim">loading…</div></div>
  </div>
</div>
<script src="season.js"></script>
<script>
seasonNav('standings');
(async()=>{
  try{
    const d=await j('/api/season-odds');
    setHdr(d.myTeam,d.week);
    const avg=nm=>(((d.odds[nm]||{}).title||0)+((d.oddsOurs[nm]||{}).title||0))/2;
    const rows=Object.keys(d.odds).sort((a,b)=>avg(b)-avg(a));
    $('tbl').innerHTML='<table><tr><th>team</th><th class="num">title ESPN</th><th class="num">title OURS</th><th class="num">playoff</th><th class="num">xW</th></tr>'
      +rows.map(nm=>{const me=nm===d.myTeam,e=d.odds[nm]||{},o=d.oddsOurs[nm]||{};
        return `<tr class="${me?'me':''}"><td>${esc(nm)}${me?' ◄':''}</td><td class="num">${pct(e.title||0)}</td>
          <td class="num ${Math.abs((e.title||0)-(o.title||0))>=0.03?'cy':''}">${pct(o.title||0)}</td>
          <td class="num dim">${Math.round(((e.playoff||0)+(o.playoff||0))/2*100)}%</td>
          <td class="num dim">${(((e.expWins||0)+(o.expWins||0))/2).toFixed(1)}</td></tr>`;}).join('')
      +'</table><div class="dim" style="margin-top:6px">'+esc(d.noiseNote||'')+'</div>';
    $('map').innerHTML=((d.tradeMap||[]).map(t=>`<div class="rowline">
      <b class="${t.delta>0?'good':'bad'}">${t.delta>0?'BUY':'SELL'}</b> ${esc(t.name)}
      <span class="dim">(${t.pos}${t.mine?' · YOURS':' · '+esc(t.owner)}) · ESPN ${t.pos}${t.espnRank} vs ours ${t.pos}${t.ourRank}</span>
      <div class="dim">${esc(t.read)}</div></div>`).join('')
      ||(d.tradeMapNote?'':'<div class="dim">judges agree on everyone (rare)</div>'))
      +(d.tradeMapNote?'<div class="dim">'+esc(d.tradeMapNote)+'</div>':'')
      +(d.oursJudgeNote?'<div class="dim" style="margin-top:4px">'+esc(d.oursJudgeNote)+'</div>':'');
  }catch(e){$('tbl').innerHTML='<div class="err">'+esc(e.message)+'</div>';}
  try{
    const pl=await j('/api/planner');
    let h='';
    (pl.crunch||[]).forEach(c=>{
      if(!c.byes.length)return;
      h+=`<div class="rowline${c.alert?' bad':''}">wk ${c.week}: ${c.byes.map(b=>`${esc(b.name)}${b.starter?' <b>(starter)</b>':''}`).join(', ')}${c.alert?' — <b class="bad">CRUNCH: plan a pickup the Tuesday before</b>':''}</div>`;
    });
    h=h||'<div class="rowline good">✓ no byes hit your roster in the next 4 weeks</div>';
    h+='<div class="dim" style="margin:8px 0 4px">playoff weeks (15–17) opponents</div><table><tr><th>player</th><th>15</th><th>16</th><th>17</th></tr>'
      +(pl.playoff||[]).slice(0,12).map(p=>`<tr><td>${esc(p.name)} <span class="dim">${p.pos}</span></td><td class="${p.wk15==='BYE'?'bad':'dim'}">${p.wk15}</td><td class="${p.wk16==='BYE'?'bad':'dim'}">${p.wk16}</td><td class="${p.wk17==='BYE'?'bad':'dim'}">${p.wk17}</td></tr>`).join('')+'</table>'
      +`<div class="dim" style="margin-top:4px">${esc(pl.note||'')}</div>`;
    $('plan').innerHTML=h;
  }catch(e){$('plan').innerHTML='<div class="err">'+esc(e.message)+'</div>';}
  try{
    const h=(await j('/api/season-history')).history||[];
    const c=$('traj'),r=c.getBoundingClientRect(),dpr=window.devicePixelRatio||1;
    c.width=r.width*dpr;c.height=190*dpr;const x=c.getContext('2d');x.scale(dpr,dpr);
    if(h.length<2){$('trajNote').textContent=`${h.length} snapshot(s) logged — the line draws itself as the season goes. Archive started today on purpose.`;return;}
    const W=r.width,H=190,PL=36,PB=16,PT=8;
    const teams=Object.keys(h[h.length-1].ours||{});
    const maxT=Math.max(0.2,...h.flatMap(s=>teams.map(t=>Math.max((s.ours[t]||{}).title||0,(s.espn[t]||{}).title||0))))*1.1;
    const X=i=>PL+(W-PL-8)*(i/(h.length-1)), Y=v=>PT+(H-PT-PB)*(1-v/maxT);
    x.strokeStyle='#1F2A3C';x.beginPath();[0,0.1,maxT].forEach(g=>{x.moveTo(PL,Y(g));x.lineTo(W-8,Y(g));});x.stroke();
    x.fillStyle='#5B6B82';x.font='9px monospace';[0,0.1,maxT].forEach(g=>x.fillText((g*100).toFixed(0)+'%',2,Y(g)+3));
    const my=h[0].myTeam||teams.find(t=>/SCLSU/i.test(t))||teams[0];
    teams.forEach(t=>{
      const me=/SCLSU/i.test(t)||t===my;
      [['espn',me?'rgba(245,166,35,.35)':'rgba(147,164,188,.18)'],['ours',me?'#F5A623':'rgba(147,164,188,.45)']].forEach(([src,col])=>{
        x.strokeStyle=col;x.lineWidth=me?2:1;x.beginPath();
        h.forEach((s,i)=>{const v=((s[src]||{})[t]||{}).title||0;i?x.lineTo(X(i),Y(v)):x.moveTo(X(i),Y(v));});
        x.stroke();});
    });
    $('trajNote').textContent=`${h.length} daily snapshots · amber = you`;
  }catch(e){$('trajNote').textContent='trajectory: '+e.message;}
})();
</script>
</body></html>
