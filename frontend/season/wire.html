<!doctype html>
<html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>SeasonIQ · Wire</title><link rel="stylesheet" href="season.css"/></head>
<body>
<div class="grid">
  <div class="panel"><h2>WAIVER WIRE <span class="r">decision-grade — actions or all clear</span></h2><div id="wire"><div class="skel" style="height:120px"></div></div></div>
  <div class="panel"><h2>ROOM ACTIVITY <span class="r">tendency log accumulating → waiver_log.jsonl</span></h2><div id="act"><div class="skel" style="height:120px"></div></div></div>
</div>
<script src="season.js"></script>
<script>
seasonNav('wire');
(async()=>{
  try{
    const d=await j('/api/waivers');
    setHdr(d.myTeam,d.week,d.fetchedAt);
    renderWire(d,$('wire'),false);
    $('act').innerHTML=(d.roomActivity||[]).map(m=>{
      const add=/ADD/i.test(m.action);
      return `<div class="rowline" style="display:flex;gap:10px;align-items:baseline">
        <span style="font-size:14px">${add?'⬆':'⬇'}</span>
        <span style="flex:1"><b class="${add?'good':'bad'}">${esc(m.action)}</b> ${esc(m.player)}
        <div class="dim">${esc(m.owner||m.team||'')}${m.bid?' · $'+m.bid:''}</div></span></div>`;
    }).join('')||'<div class="dim">quiet room</div>';
  }catch(e){$('wire').innerHTML='<div class="err">'+esc(e.message)+'</div>';}
})();
</script>
</body></html>
